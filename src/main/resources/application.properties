spring.application.name = demo

# Configuration de la base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Permet à Hibernate de créer automatiquement les tables à partir de nos entités Java
spring.jpa.hibernate.ddl-auto=update

# Activer la console Web H2 pour inspecter vos données (ex: http://localhost:8080/h2-console)
spring.h2.console.enabled=true

joinfaces.primefaces.theme=saga