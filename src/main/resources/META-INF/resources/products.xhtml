<ui:composition template="/templates/template.xhtml"
				xmlns="http://www.w3.org/1999/xhtml"
				xmlns:h="jakarta.faces.html"
				xmlns:ui="jakarta.faces.facelets"
				xmlns:f="jakarta.faces.core"
				xmlns:p="http://primefaces.org/ui">

	<!-- Redéfinition du titre de l'onglet -->
	<ui:define name="title">Liste des produits</ui:define>

	<!-- Injection du contenu spécifique dans le layout -->
	<ui:define name="content">
		<h1>Liste des produits disponibles</h1>
		<p>Voici le catalogue de notre application Spring Boot + Jakarta Faces :</p>

		<!-- 2. BOUTON PRIMEFACES LOOK & FEEL -->
		<div style="margin-bottom: 20px;">
			<p:button value="Ajouter un produit" icon="pi pi-plus" outcome="add-product" styleClass="ui-button-warning" />
		</div>

		<!-- Une table simple affichant des données fictives venant d'un Bean -->
		<h:dataTable value="#{productBean.products}" var="product" border="1" cellpadding="10" style="border-collapse:collapse; width:100%;">
			<h:column>
				<f:facet name="header">ID</f:facet>
				#{product.id}
			</h:column>
			<h:column>
				<f:facet name="header">Nom du produit</f:facet>
				#{product.name}
			</h:column>
			<h:column>
				<f:facet name="header">Prix</f:facet>
				#{product.price} €
			</h:column>
		</h:dataTable>
	</ui:define>

</ui:composition>
